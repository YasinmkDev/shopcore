name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # 001c-1 follow-up 4: the branch CI run is dispatched manually
  # (`gh workflow run ci.yml --ref wip/001c-1`) — a push to a WIP
  # branch does not trigger CI on its own.
  workflow_dispatch:

jobs:
  check:
    # ADR-015: windows-latest only for now; Linux/macOS matrix comes later.
    runs-on: windows-latest
    # ADR-022: openssl-src runs the perl named by OPENSSL_SRC_PERL (else
    # PERL, else PATH). Pin it to Strawberry Perl: the runner's PATH perl
    # is Git's MSYS2 perl, which lacks Locale::Maketext::Simple and fails
    # OpenSSL's Configure. PATH prepending alone did not change which perl
    # the build script resolved.
    env:
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
    steps:
      - uses: actions/checkout@v4

      # ADR-022: the vendored OpenSSL build (SQLCipher) runs OpenSSL's
      # Configure under `perl` from PATH. The runner's default perl is
      # Git's MSYS2 perl, which lacks core modules (Locale::Maketext::Simple)
      # and fails Configure. Strawberry Perl (preinstalled on the runner)
      # must come first.
      - name: Put Strawberry Perl first on PATH
        run: |
          if (-not (Test-Path "C:\Strawberry\perl\bin\perl.exe")) { throw "Strawberry Perl not found at C:\Strawberry\perl\bin" }
          Add-Content $env:GITHUB_PATH "C:\Strawberry\perl\bin"
          perl -v | Select-Object -First 2
          where.exe perl

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Install pnpm 12.18.0
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install just 1.59.0
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0

      - name: Install cargo-nextest 0.9.151
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151

      - name: Install cargo-deny 0.20.2
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Run just check
        run: just check

      # Spec 001b-1 req. 11: the dev seed is behind the `dev-seed` cargo
      # feature. This runs the seed integration test (fresh DB → usable
      # till) with the feature on. The release-absence half of the test
      # lives in the build-windows job (grep of the release binary).
      - name: Run dev-seed tests
        run: cargo nextest run -p shopcore-core --features dev-seed --test seed

      # Spec 001c-1 amendment 4: the dev auto-session is behind the
      # `dev-session` cargo feature (which enables shopcore-core/dev-seed).
      # Feature-gated code must compile in CI, not only on a dev machine.
      - name: Compile desktop with dev-session feature
        run: cargo check -p shopcore-desktop --all-targets --features dev-session

      # 001c-1 follow-up 4: the dev-only command impl
      # (`list_sample_barcodes`) and the `dev_build` status flag are
      # covered by feature-gated tests that only run with dev-session
      # on (the plain `just check` run covers the release behaviour:
      # the command returns DEV_NOT_AVAILABLE).
      - name: Run desktop tests with dev-session feature
        run: cargo nextest run -p shopcore-desktop --features dev-session

      # Spec 001c-2, amendment 1 (e): the e2e shim is behind the
      # `e2e-shim` cargo feature. Feature-gated code must compile
      # and its dispatch tests must run in CI. The release-absence
      # half lives in the build-windows job (binary grep).
      - name: Run desktop tests with e2e-shim feature
        run: cargo nextest run -p shopcore-desktop --features e2e-shim

      - name: Check generated types are fresh
        run: |
          just gen-types
          git diff --exit-code -- packages/protocol-ts/src/generated.ts

  bench-smoke:
    # Spec 002: 10k-row smoke run as a RELATIVE regression tripwire against
    # the stored baseline (fails only on >2x regression). NOT an absolute
    # budget check — the absolute budgets are gated by the manual full run
    # on the target PC (05, amendment 2).
    needs: check
    runs-on: windows-latest
    # ADR-022: same Strawberry Perl pin as the check job (vendored OpenSSL).
    env:
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Put Strawberry Perl first on PATH
        run: |
          if (-not (Test-Path "C:\Strawberry\perl\bin\perl.exe")) { throw "Strawberry Perl not found at C:\Strawberry\perl\bin" }
          Add-Content $env:GITHUB_PATH "C:\Strawberry\perl\bin"
          perl -v | Select-Object -First 2

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install just 1.59.0
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0

      - name: Run bench smoke (10k rows, baseline tripwire)
        run: just bench-smoke

  build-windows:
    # Builds the Windows .exe for testing. Runs only when `check` is green.
    # Added 2026-11-10 at the user's request; installer distribution is
    # otherwise a later spec's job.
    needs: check
    runs-on: windows-latest
    # ADR-022: same Strawberry Perl pin as the check job (vendored OpenSSL).
    env:
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
    steps:
      - uses: actions/checkout@v4

      # ADR-022: same Strawberry Perl fix as the check job (vendored OpenSSL).
      - name: Put Strawberry Perl first on PATH
        run: |
          if (-not (Test-Path "C:\Strawberry\perl\bin\perl.exe")) { throw "Strawberry Perl not found at C:\Strawberry\perl\bin" }
          Add-Content $env:GITHUB_PATH "C:\Strawberry\perl\bin"
          perl -v | Select-Object -First 2

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Install pnpm 12.18.0
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install just 1.59.0
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows app
        run: just build

      # Spec 001b-1 req. 11 (release-absence test) + key management
      # (2026-11-11): the dev seed is behind the `dev-seed` cargo
      # feature, which no release profile enables. The seed marker
      # string (SHOPCORE_DEV_SEED_MARKER_V1) exists only in the seed
      # module — if it is found in the release binary, the feature
      # leaked into a release build and this step fails. The seed PINs
      # (1234 cashier / 4321 manager) live in the seed file alongside
      # the marker, so the marker grep covers them (the PINs themselves
      # are too short/generic to grep for reliably). The test DB key
      # string (test-key-32-bytes-long-0123456789) is unique, so it is
      # grepped directly — it must never reach a release build either.
      # Spec 001c-2, amendment 1 (e): the same applies to the e2e
      # shim marker (SHOPCORE_E2E_SHIM_V1) — the `e2e-shim` feature
      # must never be enabled in a release build.
      - name: Verify dev-seed marker, test key, and e2e-shim marker are absent from release binary
        run: |
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("target/release/shopcore-desktop.exe"))
          if ($text.Contains("SHOPCORE_DEV_SEED_MARKER_V1")) { throw "dev-seed marker found in release binary — the dev-seed feature leaked into a release build" }
          if ($text.Contains("test-key-32-bytes-long-0123456789")) { throw "test DB key found in release binary — a test key leaked into a release build" }
          if ($text.Contains("SHOPCORE_E2E_SHIM_V1")) { throw "e2e-shim marker found in release binary — the e2e-shim feature leaked into a release build" }
          Write-Host "dev-seed marker, test DB key, and e2e-shim marker absent from release binary"

      # Spec 001c-2: the release UI bundle must contain no e2e-shim
      # markers (the VITE_SHOPCORE_E2E flag strips HttpClient at
      # build time). `just build` above already built the release
      # bundle; this rebuilds + greps it.
      - name: Verify release UI bundle contains no e2e-shim markers
        run: just check-release-bundle

      - name: Upload Windows exe + installer
        uses: actions/upload-artifact@v4
        with:
          name: shopcore-windows-0.1.0
          path: |
            target/release/shopcore-desktop.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  build-dev:
    # 001c-1 follow-up 4: the separate dev artifact for testing —
    # dev-seed + dev-session enabled, its own app identifier
    # (com.shopcore.desktop.dev, so its own data folder — it never
    # touches the prod database). Runs only when `check` is green.
    # The release artifact (build-windows) stays WITHOUT dev-seed /
    # dev-session; its release-absence step is untouched.
    needs: check
    runs-on: windows-latest
    # ADR-022: same Strawberry Perl pin as the check job (vendored OpenSSL).
    env:
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
    steps:
      - uses: actions/checkout@v4

      # ADR-022: same Strawberry Perl fix as the check job (vendored OpenSSL).
      - name: Put Strawberry Perl first on PATH
        run: |
          if (-not (Test-Path "C:\Strawberry\perl\bin\perl.exe")) { throw "Strawberry Perl not found at C:\Strawberry\perl\bin" }
          Add-Content $env:GITHUB_PATH "C:\Strawberry\perl\bin"
          perl -v | Select-Object -First 2

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Install pnpm 12.18.0
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install just 1.59.0
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dev Windows app
        run: just build-dev

      # The POSITIVE half of the release-absence test: the dev binary
      # MUST contain the dev-seed marker — if it does not, the
      # dev-session feature did not take effect and this is not a dev
      # build at all (the banner would lie). The marker grep covers the
      # seed PINs too (they live in the seed file alongside the marker).
      - name: Verify dev-seed marker is present in dev binary
        run: |
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("target/release/shopcore-desktop.exe"))
          if (-not $text.Contains("SHOPCORE_DEV_SEED_MARKER_V1")) { throw "dev-seed marker NOT found in dev binary — the dev-session feature did not take effect" }
          Write-Host "dev-seed marker present in dev binary"

      - name: Upload dev Windows exe + installer
        uses: actions/upload-artifact@v4
        with:
          name: shopcore-desktop-dev
          path: |
            target/release/shopcore-desktop.exe
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi

  bench-windows:
    # Spec 002 hardening (2026-11-10): builds the standalone bench exe
    # so the user can run the full gate on the target PC with no dev
    # tools. Runs only when `check` is green. Artifact contains the
    # exe + RUN.md (one-page instructions, incl. the debug route for
    # scenarios 7-8).
    needs: check
    runs-on: windows-latest
    # ADR-022: same Strawberry Perl pin as the check job (vendored OpenSSL).
    env:
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Put Strawberry Perl first on PATH
        run: |
          if (-not (Test-Path "C:\Strawberry\perl\bin\perl.exe")) { throw "Strawberry Perl not found at C:\Strawberry\perl\bin" }
          Add-Content $env:GITHUB_PATH "C:\Strawberry\perl\bin"
          perl -v | Select-Object -First 2

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install just 1.59.0
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0

      - name: Build bench exe (release)
        run: just bench-exe

      - name: Upload bench exe + RUN.md
        uses: actions/upload-artifact@v4
        with:
          name: shopcore-bench-windows
          path: |
            target/release/shopcore-bench.exe
            crates/bench/RUN.md

  server-tests:
    # Spec 005 (ADR-015, amended 2026-11-10): the server/Postgres chaos
    # tests run on a Linux job with a Postgres service container. The
    # till-side unit tests also run on the Windows `check` job. This job
    # FAILS if Postgres is unavailable (amendment 5) — the chaos tests
    # never skip silently; the env-flag skip is local-only.
    needs: check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: shopcore
          POSTGRES_PASSWORD: shopcore
          POSTGRES_DB: shopcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://shopcore:shopcore@localhost:5432/shopcore_test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest 0.9.151
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151

      - name: Run sync chaos tests (Postgres required, no silent skip)
        run: cargo nextest run -p shopcore-server --test chaos

  e2e:
    # Spec 001c-2: Playwright checkout flow against the REAL desktop
    # binary (e2e-shim + dev-session features) and the e2e UI build.
    # Runs only when `check` is green. Windows: GUI apps run on
    # windows-latest runners, so the desktop opens its window there
    # (no xvfb needed — the harness only wraps it on Linux).
    needs: check
    runs-on: windows-latest
    # ADR-022: same Strawberry Perl pin as the check job (vendored OpenSSL).
    env:
      OPENSSL_SRC_PERL: 'C:\Strawberry\perl\bin\perl.exe'
    steps:
      - uses: actions/checkout@v4

      - name: Put Strawberry Perl first on PATH
        run: |
          if (-not (Test-Path "C:\Strawberry\perl\bin\perl.exe")) { throw "Strawberry Perl not found at C:\Strawberry\perl\bin" }
          Add-Content $env:GITHUB_PATH "C:\Strawberry\perl\bin"
          perl -v | Select-Object -First 2

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"

      - name: Install pnpm 12.18.0
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Install just 1.59.0
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.59.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @shopcore/ui exec playwright install chromium

      - name: Run Playwright e2e (builds e2e UI + desktop, runs checkout spec)
        run: just e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/ui/playwright-report
