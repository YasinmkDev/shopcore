[package]
name = "shopcore-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "ShopCore cloud server: Axum + PostgreSQL, tenant row-level security, monthly partitions, job queue (Phase 5). Spec 005 sync spike: outbox apply, pull cursors, snapshot download."

[dependencies]
axum = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shopcore-domain = { workspace = true }
shopcore-protocol = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
# Integration (chaos) tests spin the server on an ephemeral port and drive
# it with the sync client over real HTTP.
rusqlite = { workspace = true }
shopcore-sync-client = { path = "../sync-client", version = "0.1.0" }
# The till→server integration test builds a real till (001b-1 migrations +
# 001b-2 sale use cases) and pushes its outbox rows to the real server.
shopcore-core = { path = "../core", version = "0.1.0" }
shopcore-db = { path = "../db", version = "0.1.0" }

[lints]
workspace = true
