[package]
name = "shopcore-bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "ShopCore benchmarks: seeds data (just seed-large) and measures the budgets in 05-performance-budgets.md."

[[bin]]
name = "shopcore-bench"
path = "src/main.rs"

[dependencies]
# rusqlite is already a workspace dependency (spec 000, ADR-013 pins ts-rs;
# rusqlite 0.41.1 bundled-sqlcipher-vendored-openssl). The bench DB must use
# the same SQLCipher engine as the real app, or timings are meaningless.
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# New for spec 002 (approved 2026-11-10, conditional on the proof in the
# session summary): rand 0.10.3, hdrhistogram 7.6.0 — see [workspace.dependencies].
rand.workspace = true
hdrhistogram.workspace = true
# The real app schema (spec 001b-2): the bench runs the 001b-1 migrations
# via shopcore-db instead of a throwaway mirrored schema. Workspace
# member, not a new external dependency.
shopcore-db = { path = "../db", version = "0.1.0" }

[lints]
workspace = true
