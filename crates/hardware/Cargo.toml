[package]
name = "shopcore-hardware"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "ShopCore hardware: driver traits + implementations + mock drivers (printer, scanner, drawer, scale, display, payment terminal, label printer)."

[dependencies]
tokio = { workspace = true }
thiserror = { workspace = true }
# serde for PrintDoc: the print queue (001b-2) stores the document as JSON
# in print_job.payload_json. Workspace dependency, not a new one.
serde = { workspace = true }

[dev-dependencies]
# Test-only: the 001c-2 backward-compat test deserializes an old
# print-job payload (no `discount_minor`). Already a pinned workspace
# dependency — this adds nothing to Cargo.lock.
serde_json = { workspace = true }

[lints]
workspace = true
