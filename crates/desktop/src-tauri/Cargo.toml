[package]
name = "shopcore-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "ShopCore desktop: Tauri 2 shell (Windows first) embedding the core. The UI renders state and sends intents; all logic lives in Rust."

[[bin]]
name = "shopcore-desktop"
path = "src/main.rs"

[dependencies]
tauri = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
shopcore-core = { workspace = true }
shopcore-db = { path = "../../db", version = "0.1.0" }
shopcore-hardware = { path = "../../hardware", version = "0.1.0" }
shopcore-protocol = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }

[features]
# Dev auto-session (spec 001c-1, amendment 4): fills the SessionProvider
# in dev from the dev seed. Enables `shopcore-core/dev-seed`, so this
# feature must NEVER be enabled in a release build — CI greps the
# release binary for the seed marker (see .github/workflows/ci.yml).
# `just dev` enables it; `just build` does not.
dev-session = ["shopcore-core/dev-seed"]

[build-dependencies]
# Standard layout since 2026-11-10: Cargo.toml sits in src-tauri/ next to
# tauri.conf.json, so plain tauri_build::build() finds the config and
# main.rs uses tauri::generate_context!(). No codegen feature needed.
tauri-build = { version = "2.7.4", features = [] }

[lints]
workspace = true
