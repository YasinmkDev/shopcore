[package]
name = "shopcore-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "ShopCore desktop: Tauri 2 shell (Windows first) embedding the core. The UI renders state and sends intents; all logic lives in Rust."

[[bin]]
name = "shopcore-desktop"
path = "src/main.rs"

[dependencies]
tauri = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
shopcore-core = { workspace = true }
shopcore-protocol = { workspace = true }

[build-dependencies]
# Standard layout since 2026-11-10: Cargo.toml sits in src-tauri/ next to
# tauri.conf.json, so plain tauri_build::build() finds the config and
# main.rs uses tauri::generate_context!(). No codegen feature needed.
tauri-build = { version = "2.7.4", features = [] }

[lints]
workspace = true
