[package]
name = "shopcore-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "ShopCore desktop: Tauri 2 shell (Windows first) embedding the core. The UI renders state and sends intents; all logic lives in Rust."

[[bin]]
name = "shopcore-desktop"
path = "src/main.rs"

[dependencies]
tauri = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# axum is OPTIONAL (001c-2): only the `e2e-shim` feature serves HTTP
# (the Playwright shim). The release graph must NOT contain axum —
# proven by `cargo tree` and the CI release-absence grep.
axum = { workspace = true, optional = true }
shopcore-core = { workspace = true }
shopcore-db = { path = "../../db", version = "0.1.0" }
# shopcore-domain at the IPC boundary (001c-2): the desktop parses the
# discount kind/value into the domain `LineDiscount` before calling the
# use case. Workspace dependency, not a new one.
shopcore-domain = { workspace = true }
shopcore-hardware = { path = "../../hardware", version = "0.1.0" }
shopcore-protocol = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }

[features]
# Dev auto-session (spec 001c-1, amendment 4): fills the SessionProvider
# in dev from the dev seed. Enables `shopcore-core/dev-seed`, so this
# feature must NEVER be enabled in a release build — CI greps the
# release binary for the seed marker (see .github/workflows/ci.yml).
# `just dev` enables it; `just build` does not.
dev-session = ["shopcore-core/dev-seed"]
# The Playwright e2e shim (spec 001c-2, amendment 1, option A):
# serves HTTP on 127.0.0.1 only, behind a per-run token, dispatching
# to the same `*_impl` functions as the Tauri commands. NEVER enabled
# in a release build — CI greps the release binary for the shim
# marker (see .github/workflows/ci.yml).
e2e-shim = ["dep:axum"]

[build-dependencies]
# Standard layout since 2026-11-10: Cargo.toml sits in src-tauri/ next to
# tauri.conf.json, so plain tauri_build::build() finds the config and
# main.rs uses tauri::generate_context!(). No codegen feature needed.
tauri-build = { version = "2.7.4", features = [] }

[lints]
workspace = true
